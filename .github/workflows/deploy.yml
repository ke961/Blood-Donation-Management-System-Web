name: CI/CD Pipeline (Vercel & Render)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # -------------------------------------------------------------
  # JOB 1: Test & Build Frontend (React + Vite)
  # -------------------------------------------------------------
  test-frontend:
    name: Test & Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build

  # -------------------------------------------------------------
  # JOB 2: Test Backend (FastAPI + Python)
  # -------------------------------------------------------------
  test-backend:
    name: Test Backend API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  # -------------------------------------------------------------
  # JOB 3: Deploy Backend to Render (Triggers Render Deploy Hook)
  # -------------------------------------------------------------
  deploy-backend:
    name: Deploy Backend to Render
    needs: [test-frontend, test-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render Deployment
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            echo "Triggering Render Deploy Hook..."
            curl -s -f -X POST "$RENDER_HOOK"
          else
            echo "No RENDER_DEPLOY_HOOK_URL secret set. Render will auto-deploy from main."
          fi
