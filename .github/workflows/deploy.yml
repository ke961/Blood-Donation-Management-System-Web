name: CI/CD Pipeline (Vercel & Render)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # -------------------------------------------------------------
  # JOB 1: Test & Build Frontend (React + Vite)
  # -------------------------------------------------------------
  test-frontend:
    name: Test & Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build

  # -------------------------------------------------------------
  # JOB 2: Test Backend (FastAPI + Python)
  # -------------------------------------------------------------
  test-backend:
    name: Test Backend API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  # -------------------------------------------------------------
  # JOB 3: Verify Deployment Pipeline
  # -------------------------------------------------------------
  deploy-status:
    name: Verify Deploy Pipeline
    needs: [test-frontend, test-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Log Deployment Verification
        run: |
          echo "All frontend and backend integration tests passed successfully!"
          echo "Vercel and Render will now automatically deploy the updated main branch."
